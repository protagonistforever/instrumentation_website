{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <h1 class="display-5 fw-bold text-center mb-5 text-primary">Pressure & Differential Pressure Gauges</h1>

    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-5">
                    <h3 class="card-title text-center mb-4">Configure Gauge</h3>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Type</label>
                        <select class="form-select form-select-lg" id="type"><option>-- Choose Type --</option></select>
                        <div class="spinner-border spinner-border-sm text-primary mt-2 d-none" id="type-spinner"></div>
                    </div>
                    <div class="mb-4"><label class="form-label fw-semibold">Sensing Element</label><select class="form-select form-select-lg" id="sensing" disabled><option>-- First select Type --</option></select></div>
                    <div class="mb-4"><label class="form-label fw-semibold">Diaphragm Seal</label><select class="form-select form-select-lg" id="diaseal" disabled><option>-- First select Sensing --</option></select></div>
                    <div class="mb-4"><label class="form-label fw-semibold">Dial Size</label><select class="form-select form-select-lg" id="dialsize" disabled><option>-- First select Diaphragm Seal --</option></select></div>
                    <div class="mb-4"><label class="form-label fw-semibold">Range</label><select class="form-select form-select-lg" id="range" disabled><option>-- First select Dial Size --</option></select></div>
                    <div class="mb-4"><label class="form-label fw-semibold">Accessories</label><select class="form-select form-select-lg" id="accessories" disabled><option>-- First select Range --</option></select></div>
                </div>
            </div>
            <div id="results" class="mt-5"></div>
        </div>
    </div>
</div>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
$(document).ready(function() {
    $('#type-spinner').removeClass('d-none');
    $.get("/api/pg-dpg/types").done(function(opts) {
        opts.forEach(o => $("#type").append(`<option value="${o}">${o}</option>`));
    }).always(() => $('#type-spinner').addClass('d-none'));

    $("#type").change(() => chain("/api/pg-dpg/sensing", {type: $("#type").val()}, "#sensing", "-- Select Sensing Element --"));
    $("#sensing").change(() => chain("/api/pg-dpg/diaseal", {type: $("#type").val(), sensing: $("#sensing").val()}, "#diaseal", "-- Select Diaphragm Seal --"));
    $("#diaseal").change(() => chain("/api/pg-dpg/dialsize", {type: $("#type").val(), sensing: $("#sensing").val(), diaseal: $("#diaseal").val()}, "#dialsize", "-- Select Dial Size --"));
    $("#dialsize").change(() => chain("/api/pg-dpg/range", {type: $("#type").val(), sensing: $("#sensing").val(), diaseal: $("#diaseal").val(), dialsize: $("#dialsize").val()}, "#range", "-- Select Range --"));
    $("#range").change(() => chain("/api/pg-dpg/accessories", {type: $("#type").val(), sensing: $("#sensing").val(), diaseal: $("#diaseal").val(), dialsize: $("#dialsize").val(), range: $("#range").val()}, "#accessories", "-- Select Accessories --"));
    $("#accessories").change(() => showDetails("/api/pg-dpg/details", {type: $("#type").val(), sensing: $("#sensing").val(), diaseal: $("#diaseal").val(), dialsize: $("#dialsize").val(), range: $("#range").val(), accessories: $("#accessories").val()}, "PG/DPG Gauge"));

    function chain(url, params, sel, placeholder) {
        $(sel).nextAll('select').prop("disabled", true).empty().append('<option>-- Select previous --</option>');
        $("#results").empty();
        if (Object.values(params).every(v => v)) load(url, params, sel, placeholder);
    }

    function load(url, params, sel, placeholder) {
        $(sel).prop("disabled", true).empty().append('<option>Loading...</option>');
        $.get(url, params).done(function(opts) {
            $(sel).empty().append(`<option value="">${placeholder}</option>`);
            opts.forEach(o => $(sel).append(`<option value="${o}">${o}</option>`));
            $(sel).prop("disabled", false);
        });
    }

    function showDetails(url, params, title) {
        $("#results").html('<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>');
        $.get(url, params).done(function(data) {
            $("#results").empty();
            if (data.length === 0) {
                $("#results").html('<div class="alert alert-info text-center">No matching gauge found.</div>');
                return;
            }
            let html = `<h3 class="mb-4 text-primary">${title}s (${data.length})</h3><div class="table-responsive"><table class="table table-hover"><thead class="table-light"><tr><th>Cost</th><th>Supplier</th><th>Date</th><th>Remarks</th></tr></thead><tbody>`;
            data.forEach(r => html += `<tr><td><strong>₹${r.cost || r.Cost || '-'}</strong></td><td>${r.supplier || r.Supplier || '-'}</td><td>${r.date || r.Date || '-'}</td><td>${r.remarks || r.Remarks || '-'}</td></tr>`);
            html += '</tbody></table></div>';
            $("#results").html(html);
        });
    }
});
</script>

<style>
    .card { border-radius: 16px; transition: transform 0.2s; }
    .card:hover { transform: translateY(-5px); }
    .form-select-lg { border-radius: 12px; padding: 0.75rem 1rem; }
    .table th { font-weight: 600; background: #f8f9fa; }
</style>
{% endblock %}
