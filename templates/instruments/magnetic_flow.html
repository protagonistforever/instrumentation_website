{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <h1 class="display-5 fw-bold text-center mb-5 text-primary">Magnetic Flow Meter Selection</h1>

    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-5">
                    <h3 class="card-title text-center mb-4">Configure Your Meter</h3>

                    <form id="selection-form">
                        <!-- Size -->
                        <div class="mb-4">
                            <label for="size" class="form-label fw-semibold">Size</label>
                            <select class="form-select form-select-lg" id="size" required>
                                <option value="">-- Choose Size --</option>
                            </select>
                            <div class="spinner-border spinner-border-sm text-primary mt-2 d-none" role="status" id="size-spinner">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>

                        <!-- Type -->
                        <div class="mb-4">
                            <label for="type" class="form-label fw-semibold">Type</label>
                            <select class="form-select form-select-lg" id="type" disabled>
                                <option value="">-- First select Size --</option>
                            </select>
                        </div>

                        <!-- Liner Material -->
                        <div class="mb-4">
                            <label for="liner" class="form-label fw-semibold">Liner Material</label>
                            <select class="form-select form-select-lg" id="liner" disabled>
                                <option value="">-- First select Type --</option>
                            </select>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Results -->
            <div id="results" class="mt-5"></div>
        </div>
    </div>
</div>

<!-- Dependencies -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
$(document).ready(function() {
    // 1. Load Sizes on page load
    $('#size-spinner').removeClass('d-none');
    $.get("/api/magnetic/sizes")
        .done(function(sizes) {
            sizes.forEach(size => {
                $("#size").append(`<option value="${size}">${size}</option>`);
            });
        })
        .always(() => $('#size-spinner').addClass('d-none'));

    // 2. Size → load Types
    $("#size").change(function() {
        const size = $(this).val();
        reset("#type", "-- First select Size --");
        reset("#liner", "-- First select Type --");
        $("#results").empty();

        if (size) {
            load("/api/magnetic/types", {size}, "#type", "-- Select Type --");
        }
    });

    // 3. Type → load Liner Materials
    $("#type").change(function() {
        const size = $("#size").val();
        const type = $(this).val();
        reset("#liner", "-- First select Type --");
        $("#results").empty();

        if (type) {
            load("/api/magnetic/liners", {size, type}, "#liner", "-- Select Liner Material --");
        }
    });

    // 4. Liner Material → show results
    $("#liner").change(function() {
        const size = $("#size").val();
        const type = $("#type").val();
        const liner = $(this).val();

        $("#results").empty();

        if (!liner) return;

        $("#results").html(`
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        `);

        $.get("/api/magnetic/details", {size, type, liner})
            .done(function(data) {
                console.log("Fetched data:", data); // ← Check this in browser console (F12)

                $("#results").empty();

                if (!data || data.length === 0) {
                    $("#results").html(`
                        <div class="alert alert-info text-center">
                            <strong>No matching configuration found</strong>
                        </div>
                    `);
                    return;
                }

                let html = `
                    <h3 class="mb-4 text-primary text-center">
                        Available Configurations (${data.length})
                    </h3>
                    <div class="table-responsive">
                        <table class="table table-hover table-bordered align-middle">
                            <thead class="table-primary">
                                <tr>
                                    <th>Cost</th>
                                    <th>Supplier</th>
                                    <th>Date</th>
                                    <th>Remarks</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                data.forEach(row => {
                    html += `
                        <tr>
                            <td class="fw-bold">${row.Cost || row.cost || '-'}</td>
                            <td>${row.Supplier || row.supplier || '-'}</td>
                            <td>${row.Date || row.date || '-'}</td>
                            <td class="text-break">${row.Remarks || row.remarks || '-'}</td>
                        </tr>
                    `;
                });

                html += `</tbody></table></div>`;

                $("#results").html(html);
            })
            .fail(function() {
                $("#results").html(`
                    <div class="alert alert-danger text-center">
                        Error loading data. Please try again.
                    </div>
                `);
            });
    });

    // Helpers
    function reset(sel, text) {
        $(sel).prop("disabled", true).empty().append(`<option value="">${text}</option>`);
    }

    function load(url, params, sel, text) {
        $(sel).prop("disabled", true).empty().append('<option>Loading...</option>');
        $.get(url, params)
            .done(opts => {
                $(sel).empty().append(`<option value="">${text}</option>`);
                opts.forEach(o => $(sel).append(`<option value="${o}">${o}</option>`));
                $(sel).prop("disabled", false);
            })
            .fail(() => {
                $(sel).empty().append('<option>Error loading</option>');
            });
    }
});
</script>

<style>
    .card { border-radius: 16px; transition: transform 0.2s; }
    .card:hover { transform: translateY(-5px); }
    .form-select-lg { border-radius: 12px; padding: 0.75rem 1rem; }
    .table th { font-weight: 600; white-space: nowrap; }
    .table td { vertical-align: middle; }
    .text-break { word-break: break-word; hyphens: auto; }
    @media (max-width: 576px) {
        .display-5 { font-size: 2.5rem; }
        .table { font-size: 0.9rem; }
    }
</style>
{% endblock %}
