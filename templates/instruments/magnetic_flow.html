{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <h1 class="display-5 fw-bold text-center mb-5 text-primary">Magnetic Flow Meter Selection</h1>

    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-5">
                    <h3 class="card-title text-center mb-4">Configure Your Meter</h3>

                    <form id="selection-form">
                        <!-- Size Dropdown -->
                        <div class="mb-4">
                            <label for="size" class="form-label fw-semibold">Size</label>
                            <select class="form-select form-select-lg" id="size" required>
                                <option value="">-- Choose Size --</option>
                            </select>
                            <div class="spinner-border spinner-border-sm text-primary mt-2 d-none" role="status" id="size-spinner">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>

                        <!-- Type Dropdown -->
                        <div class="mb-4">
                            <label for="type" class="form-label fw-semibold">Type</label>
                            <select class="form-select form-select-lg" id="type" disabled>
                                <option value="">-- First select Size --</option>
                            </select>
                        </div>

                        <!-- Liner Material Dropdown -->
                        <div class="mb-4">
                            <label for="liner" class="form-label fw-semibold">Liner Material</label>
                            <select class="form-select form-select-lg" id="liner" disabled>
                                <option value="">-- First select Type --</option>
                            </select>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Results Section -->
            <div id="results" class="mt-5"></div>
        </div>
    </div>
</div>

<!-- Dependencies -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
$(document).ready(function() {
    // Load sizes on page load
    $('#size-spinner').removeClass('d-none');
    $.get("/api/magnetic/sizes")
        .done(function(sizes) {
            sizes.forEach(function(size) {
                $("#size").append(`<option value="${size}">${size}</option>`);
            });
        })
        .always(function() {
            $('#size-spinner').addClass('d-none');
        });

    // When Size changes → load Types
    $("#size").change(function() {
        const size = $(this).val();
        resetDropdown("#type", "-- First select Size --");
        resetDropdown("#liner", "-- First select Type --");
        $("#results").empty();

        if (size) {
            loadOptions("/api/magnetic/types", { size: size }, "#type", "-- Select Type --");
        }
    });

    // When Type changes → load Liner Materials
    $("#type").change(function() {
        const size = $("#size").val();
        const type = $(this).val();
        resetDropdown("#liner", "-- First select Type --");
        $("#results").empty();

        if (type) {
            loadOptions("/api/magnetic/liners", { size: size, type: type }, "#liner", "-- Select Liner Material --");
        }
    });

    // When Liner Material is selected → show results
    $("#liner").change(function() {
        const size = $("#size").val();
        const type = $("#type").val();
        const liner = $(this).val();

        $("#results").empty();

        if (liner) {
            $("#results").html(`
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            `);

            $.get("/api/magnetic/details", { size: size, type: type, liner: liner })
                .done(function(data) {
                    $("#results").empty();

                    if (data.length === 0) {
                        $("#results").html(`
                            <div class="alert alert-info text-center">
                                <strong>No matching configuration found</strong> for the selected options.
                            </div>
                        `);
                        return;
                    }

                    let html = `
                        <h3 class="mb-4 text-primary text-center">Available Configurations (${data.length})</h3>
                        <div class="table-responsive">
                            <table class="table table-hover table-bordered align-middle">
                                <thead class="table-primary">
                                    <tr>
                                        <th>Cost</th>
                                        <th>Supplier</th>
                                        <th>Date</th>
                                        <th>Remarks</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;

                    data.forEach(row => {
                        html += `
                            <tr>
                                <td><strong>${row.Cost || '-'}</strong></td>
                                <td>${row.Supplier || '-'}</td>
                                <td>${row.Date || '-'}</td>
                                <td class="text-break">${row.Remarks || '-'}</td>
                            </tr>
                        `;
                    });

                    html += `
                                </tbody>
                            </table>
                        </div>
                    `;

                    $("#results").html(html);
                })
                .fail(function() {
                    $("#results").html(`
                        <div class="alert alert-danger text-center">
                            Error loading data. Please try again later.
                        </div>
                    `);
                });
        }
    });

    // Helper: Reset a dropdown
    function resetDropdown(selector, placeholder) {
        $(selector)
            .prop("disabled", true)
            .empty()
            .append(`<option value="">${placeholder}</option>`);
    }

    // Helper: Load dropdown options via API
    function loadOptions(url, params, selector, placeholder) {
        $(selector).prop("disabled", true).empty().append('<option>Loading...</option>');
        $.get(url, params)
            .done(function(options) {
                $(selector).empty().append(`<option value="">${placeholder}</option>`);
                options.forEach(opt => {
                    $(selector).append(`<option value="${opt}">${opt}</option>`);
                });
                $(selector).prop("disabled", false);
            })
            .fail(function() {
                $(selector).empty().append(`<option value="">Error loading options</option>`);
            });
    }
});
</script>

<style>
    .card {
        border-radius: 16px;
        transition: transform 0.2s;
    }
    .card:hover {
        transform: translateY(-5px);
    }
    .form-select-lg {
        border-radius: 12px;
        padding: 0.75rem 1rem;
    }
    .table th {
        font-weight: 600;
        white-space: nowrap;
    }
    .table td {
        vertical-align: middle;
    }
    .text-break {
        word-break: break-word;
        hyphens: auto;
    }
    @media (max-width: 576px) {
        .display-5 {
            font-size: 2.5rem;
        }
        .table {
            font-size: 0.9rem;
        }
    }
</style>
{% endblock %}
